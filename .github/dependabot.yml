version: 2
multi-ecosystem-groups:
  cargo-dependencies:
    schedule:
      interval: "weekly"
  github-actions-dependencies:
    schedule:
      interval: "weekly"
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "cargo-dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "github-actions-dependencies"
