[workspace]
members = [
    "crates/dartel",
    "crates/dartel-config",
    "crates/dartel-pty",
    "crates/dartel-render",
    "crates/dartel-search",
    "crates/dartel-term",
    "crates/dartel-vt",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
repository = "https://github.com/riya-amemiya/Dartel"

[workspace.dependencies]
dartel-config = { path = "crates/dartel-config" }
dartel-pty = { path = "crates/dartel-pty" }
dartel-render = { path = "crates/dartel-render" }
dartel-search = { path = "crates/dartel-search" }
dartel-term = { path = "crates/dartel-term" }
dartel-vt = { path = "crates/dartel-vt" }
fontdb = "=0.24.0"
memchr = "=2.8.3"
regex = "=1.13.2"
rustix = { version = "=1.1.6", features = ["process", "pty", "stdio", "termios"] }
swash = "=0.2.10"
umt_rust = "=0.8.0"
unicode-width = "=0.2.3"
wgpu = { version = "=30.0.2", default-features = false, features = [
    "gles",
    "metal",
    "parking_lot",
    "std",
    "vulkan",
    "wgsl",
] }
winit = "=0.30.13"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
